<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Opening DLS white homepage colour test</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:#171613;font-family:Arial,Helvetica,sans-serif}.loader{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}.loader-inner{max-width:520px;text-align:center}.mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border:1px solid #b78324;border-radius:50%;color:#94620c;font-size:12px;font-weight:800;letter-spacing:.08em}.loader h1{margin:0;font-size:28px}.loader p{margin:12px 0 0;color:#716b62;line-height:1.55}.bar{height:5px;margin:24px auto 0;overflow:hidden;border-radius:999px;background:#eee8dd}.bar::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d4ac58,#aa7516);animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(138%)}}a{color:#8f5f0b}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loader-inner"><div class="mark">DLS</div><h1>Opening the original homepage in white</h1><p>This is a private colour test. The live DLS website has not been changed.</p><div class="bar"></div></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('/?original-white-preview-source=1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load the current homepage');
    let page=await response.text();
    page=page.replace(/<meta name="robots"[^>]*>/i,'<meta name="robots" content="noindex,nofollow">');
    page=page.replace(/<meta name="googlebot"[^>]*>/i,'<meta name="googlebot" content="noindex,nofollow">');
    page=page.replace(/<title>[^<]*<\/title>/i,'<title>Private White Homepage Colour Test | DLS Bathrooms Ltd</title>');
    page=page.replace(/<\/head>/i,'<link rel="stylesheet" href="/original-homepage-white.css?v=1"><meta name="theme-color" content="#ffffff"></head>');
    document.open();
    document.write(page);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('loader').innerHTML='<div class="loader-inner"><div class="mark">DLS</div><h1>The preview did not open</h1><p>Please refresh this page. The live website is still unchanged.</p></div>';
  }
})();
</script>
</body>
</html>
