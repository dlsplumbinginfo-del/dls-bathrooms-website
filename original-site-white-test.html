<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Loading DLS white homepage test…</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow-x:clip;background:#fff;font-family:Arial,Helvetica,sans-serif}.loading{display:grid;place-items:center;min-height:100%;padding:28px;text-align:center;color:#161411}.loading-mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 17px;border:1px solid #b98016;border-radius:50%;color:#9d6d12;font-size:13px;letter-spacing:.08em}.loading h1{margin:0;font-size:28px}.loading p{max-width:500px;margin:12px auto;color:#6b665f;line-height:1.55}.loading-bar{width:min(320px,80vw);height:5px;margin:22px auto 0;overflow:hidden;border-radius:999px;background:#eee9df}.loading-bar:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b98016,#e2bf70);animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(138%)}}
</style>
</head>
<body>
<div class="loading" id="loading"><div><div class="loading-mark">DLS</div><h1>Opening the original DLS homepage</h1><p>Applying the private white and warm-neutral colour test. The live website is not being changed.</p><div class="loading-bar"></div></div></div>
<script>

  const response=await fetch('/?original-white-source=1',{cache:'no-store'});

  let page=await response.text();

  body.dls-original-white-test .site-header{background:rgba(255,255,255,.94)!important;border-bottom:1px solid #ddd7cc!important;box-shadow:0 8px 28px rgba(37,29,15,.07)!important}

  body.dls-original-white-test .payment-card .lead,
  body.dls-original-white-test .payment-card p{color:#c8c3ba!important}
  body.dls-original-white-test .worldpay-panel p{color:#666!important}
  body.dls-original-white-test .card-payment-panel p{color:#453b2a!important}
  body.dls-original-white-test .payment-faq article{background:#151715!important}
  body.dls-original-white-test .payment-faq p{color:#99958c!important}

  body.dls-original-white-test .design-proof-pair{border-color:rgba(178,123,21,.32)!important;background:#151614!important;box-shadow:0 25px 65px rgba(38,30,16,.16)!important}
  body.dls-original-white-test .design-proof-pair figcaption strong{color:#f1eee6!important}
  body.dls-original-white-test .design-proof-pair figcaption small{color:#aaa69c!important}

  body.dls-original-white-test .gallery-grid,
  body.dls-original-white-test .process-grid,
  body.dls-original-white-test .comparison-grid,
  body.dls-original-white-test .review-grid{border-color:#ded8cd!important}
  body.dls-original-white-test .process-grid article,
  body.dls-original-white-test .process-step,
  body.dls-original-white-test .comparison-grid article,
  body.dls-original-white-test .review-card{background:#fff!important;border-color:#e1dbd0!important;color:#171512!important;box-shadow:0 10px 30px rgba(46,35,17,.06)!important}
  body.dls-original-white-test .process-grid p,
  body.dls-original-white-test .process-step p,
  body.dls-original-white-test .comparison-grid p,
  body.dls-original-white-test .review-card p{color:#625e57!important}

  body.dls-original-white-test .site-footer,
  body.dls-original-white-test footer{background:#121311!important;color:#f5f1e9!important}
  body.dls-original-white-test footer h2,
  body.dls-original-white-test footer h3,
  body.dls-original-white-test footer strong{color:#f5f1e9!important}
  body.dls-original-white-test footer p,
  body.dls-original-white-test footer span,
  body.dls-original-white-test footer a{color:#bdb8ae}

  @media(max-width:820px){
    .dls-preview-label{right:9px;bottom:80px;max-width:190px}
    body.dls-original-white-test .site-header{background:rgba(255,255,255,.97)!important}
    body.dls-original-white-test .hero-shade{background:linear-gradient(180deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.74) 48%,rgba(255,255,255,.92) 100%)!important}

    body.dls-original-white-test .trust-strip{background:#fff!important}
  }
  </style>`;
  page=page.replace(/<\/head>/i,whiteTheme+'</head>');
  document.open();
  document.write(page);
  document.close();
}catch(error){
  console.error(error);
  document.getElementById('loading').innerHTML='<div><div class="loading-mark">DLS</div><h1>The preview did not open</h1><p>Please refresh this page. Your live DLS website has not been changed.</p></div>';
}})();
</script>
</body>
</html>
