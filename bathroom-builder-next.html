<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080a0b">
<title>Bathroom Builder Next Preview | DLS Bathrooms Ltd</title>
<style>
html,body{height:100%;width:100%;max-width:100%;overflow-x:hidden}body{display:grid;place-items:center;margin:0;background:#080a0b;color:#f7f4ed;font-family:Arial,Helvetica,sans-serif;touch-action:pan-y}.load{width:min(100%,560px);max-width:100%;padding:32px 20px;text-align:center;box-sizing:border-box}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border:1px solid #d9b66b;border-radius:50%;color:#f0d592;font-size:13px;letter-spacing:.08em}h1{margin:0;font-size:clamp(24px,7vw,28px)}p{color:#aaa79f;line-height:1.6}.bar{height:5px;margin-top:22px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b88d44,#f0d592);animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}a{color:#f0d592}
</style>
</head>
<body>
<div class="load" id="load"><div class="mark">DLS</div><h1>Opening the enhanced bathroom builder</h1><p>Loading the interactive preview and demonstration catalogue…</p><div class="bar"></div></div>
<script>
(async()=>{try{
if(!("DecompressionStream" in window))throw new Error("This browser needs updating to open the enhanced preview.");
const urls=Array.from({length:6},(_,i)=>`/builder-next/part-${i+1}.txt`);
const parts=await Promise.all(urls.map(async url=>{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`Missing preview asset: ${url}`);return (await response.text()).trim();}));
const encoded=parts.join("");
if(encoded.length!==26532)throw new Error("Preview data did not load completely");
const bytes=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
let page=await new Response(stream).text();
page=page.replace(
  "topCount:$('#topCount'),mobilebar:$('#mobilebar')",
  "topCount:$('#topCount'),basketTop:$('#basketTop'),mobilebar:$('#mobilebar')"
);
const responsiveStyle=`<style id="dls-mobile-flow-fix">
html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;overscroll-behavior-x:none!important}
body{margin:0!important;position:relative!important;touch-action:pan-y}
*,*::before,*::after{box-sizing:border-box!important;min-width:0}
body>*{max-width:100%!important}
main,header,footer,section,article,aside,nav,form{min-width:0;max-width:100%}
img,picture,svg,video,canvas,iframe{max-width:100%!important;height:auto}
input,select,textarea,button{max-width:100%}
pre,code{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.dls-flow-contained{width:100%!important;max-width:100%!important;min-width:0!important;margin-left:auto!important;margin-right:auto!important}
.dls-flow-stack{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-auto-flow:row!important}
.dls-flow-wrap{flex-wrap:wrap!important}
@media(max-width:820px){
 body{width:100%!important;max-width:100%!important}
 body>*{width:100%;max-width:100%!important}
 [class*="container"],[class*="wrapper"],[class*="shell"],[class*="inner"]{max-width:100%!important;min-width:0!important}
 [class*="row"],[class*="toolbar"],[class*="actions"],[class*="controls"]{flex-wrap:wrap!important}
 [style*="min-width"]{min-width:0!important}
 [style*="width"]{max-width:100%!important}
 table{width:100%!important;max-width:100%!important;table-layout:fixed}
 th,td{overflow-wrap:anywhere;word-break:break-word}
}
</style>`;
const responsiveScript=`<script id="dls-mobile-flow-script">
(function(){
 var MOBILE_MAX=820,frame;
 function applyFlowFix(){
  var root=document.documentElement,body=document.body;
  if(!body)return;
  root.style.maxWidth='100%';root.style.overflowX='hidden';
  body.style.maxWidth='100%';body.style.overflowX='hidden';
  if(window.innerWidth>MOBILE_MAX)return;
  var viewport=root.clientWidth;
  Array.prototype.forEach.call(body.querySelectorAll('*'),function(el){
   if(/^(SCRIPT|STYLE|LINK|META|NOSCRIPT)$/.test(el.tagName))return;
   var style=window.getComputedStyle(el),rect=el.getBoundingClientRect();
   var tooWide=rect.width>viewport+1||rect.right>viewport+1||rect.left<-1||el.scrollWidth>viewport+1;
   if(!tooWide)return;
   if(style.position!=='absolute'&&style.position!=='fixed'){
    el.classList.add('dls-flow-contained');
    if(style.display.indexOf('grid')!==-1)el.classList.add('dls-flow-stack');
    if(style.display.indexOf('flex')!==-1)el.classList.add('dls-flow-wrap');
   }
  });
 }
 function queueFix(){window.cancelAnimationFrame(frame);frame=window.requestAnimationFrame(applyFlowFix)}
 window.addEventListener('resize',queueFix,{passive:true});
 window.addEventListener('orientationchange',queueFix,{passive:true});
 new MutationObserver(queueFix).observe(document.documentElement,{subtree:true,childList:true});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',queueFix,{once:true});else queueFix();
 window.setTimeout(queueFix,250);window.setTimeout(queueFix,1000);
})();
<\/script>`;
page=page.replace(/<\/head>/i,responsiveStyle+'</head>');
page=page.replace(/<\/body>/i,responsiveScript+'</body>');
document.open();document.write(page);document.close();
}catch(error){console.error(error);document.getElementById("load").innerHTML='<div class="mark">DLS</div><h1>Preview could not open</h1><p>Please refresh the page or <a href="/bathroom-builder">open the original working builder</a>.</p>';}})();
</script>
</body>
</html>
