<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080a0b">
<title>Bathroom Builder Next Preview | DLS Bathrooms Ltd</title>
<style>
html,body{height:100%;width:100%;max-width:100%;overflow-x:clip}body{display:grid;place-items:center;margin:0;background:#080a0b;color:#f7f4ed;font-family:Arial,Helvetica,sans-serif;touch-action:pan-y}.load{width:min(100%,560px);max-width:100%;padding:32px 20px;text-align:center;box-sizing:border-box}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border:1px solid #d9b66b;border-radius:50%;color:#f0d592;font-size:13px;letter-spacing:.08em}h1{margin:0;font-size:clamp(24px,7vw,28px)}p{color:#aaa79f;line-height:1.6}.bar{height:5px;margin-top:22px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b88d44,#f0d592);animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}a{color:#f0d592}
</style>
</head>
<body>
<div class="load" id="load"><div class="mark">DLS</div><h1>Opening the enhanced bathroom builder</h1><p>Loading the interactive preview and demonstration catalogue…</p><div class="bar"></div></div>
<script>
(async()=>{try{
if(!("DecompressionStream" in window))throw new Error("This browser needs updating to open the enhanced preview.");
const urls=Array.from({length:6},(_,i)=>`/builder-next/part-${i+1}.txt`);
const parts=await Promise.all(urls.map(async url=>{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`Missing preview asset: ${url}`);return (await response.text()).trim();}));
const encoded=parts.join("");
if(encoded.length!==26532)throw new Error("Preview data did not load completely");
const bytes=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
let page=await new Response(stream).text();

// Repair the basket control reference in the demonstration script.
page=page.replace(
  "topCount:$('#topCount'),mobilebar:$('#mobilebar')",
  "topCount:$('#topCount'),basketTop:$('#basketTop'),mobilebar:$('#mobilebar')"
);
page=page.replace(
  "E.basketTop.onclick=openDrawer;",
  "$('#basketTop').onclick=openDrawer;"
);

// Force one contained, vertical mobile flow with no sideways catalogue strip or page panning.
const responsiveStyle=`<style id="dls-single-flow-fix">
html,body{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:clip!important;overscroll-behavior-x:none!important}
@supports not (overflow:clip){html,body{overflow-x:hidden!important}}
body{margin:0!important;position:relative!important;touch-action:pan-y!important}
*,*::before,*::after{box-sizing:border-box!important;min-width:0}
body>*{max-width:100%!important}
main,header,footer,section,article,aside,nav,form,div{min-width:0;max-width:100%}
img,picture,svg,video,canvas,iframe{max-width:100%!important;height:auto}
input,select,textarea,button{max-width:100%}
pre,code{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:820px){
 html,body{width:100%!important;max-width:100%!important;min-width:0!important}
 .shell{width:100%!important;max-width:100%!important;margin:0!important;padding-left:14px!important;padding-right:14px!important}
 .header{left:0!important;right:0!important;width:100%!important;max-width:100%!important;padding-left:14px!important;padding-right:14px!important;gap:10px!important;overflow:hidden!important}
 .brand{min-width:0!important;max-width:calc(100% - 54px)!important;overflow:hidden!important}
 .brand>span:last-child{min-width:0!important;overflow:hidden!important}
 .brand strong,.brand small{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
 .hero,.notice,.planner,.review,.story,.footer{width:100%!important;max-width:100%!important;overflow:hidden!important}
 .hero-grid,.plan-grid,.review-grid,.story-grid,.control-row,.package-row,.catalogue-tools,.grid,.story-cards,.form2,.utility,.options{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-auto-flow:row!important;width:100%!important;max-width:100%!important}
 .hero h1,.section-head h2,.story h2{max-width:100%!important}
 .hero-actions,.control-actions,.hero-note,.summary,.panel-head,.total,.footer-grid,.footer-links,.item-controls{max-width:100%!important;flex-wrap:wrap!important}
 .tabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:100%!important;max-width:100%!important;margin:16px 0 0!important;padding:0!important;overflow:visible!important;overscroll-behavior-x:none!important}
 .tab{width:100%!important;min-width:0!important;height:auto!important;min-height:42px!important;padding:7px 8px!important;white-space:normal!important;line-height:1.2!important}
 .card{display:block!important;width:100%!important;max-width:100%!important}
 .art{width:100%!important;max-width:100%!important;min-height:180px!important;aspect-ratio:16/9!important}
 .item{grid-template-columns:44px minmax(0,1fr)!important;width:100%!important;max-width:100%!important}
 .item-price{grid-column:2!important;text-align:left!important}
 .item-copy strong,.item-copy span,.item-copy small{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere!important}
 .drawer{left:0!important;right:0!important;width:100%!important;max-width:100%!important;transform:translateX(100%)!important}
 .drawer-open .drawer{transform:none!important}
 .modal{width:100%!important;max-width:100%!important;margin:0!important}
 .modal-card{grid-template-columns:minmax(0,1fr)!important;width:100%!important}
 .toast{max-width:calc(100% - 24px)!important}
}
@media(max-width:380px){
 .tabs{grid-template-columns:minmax(0,1fr)!important}
 .brand small{display:none!important}
 .hero h1{font-size:clamp(38px,12.5vw,50px)!important}
}
</style>`;
page=page.replace(/<\/head>/i,responsiveStyle+'</head>');
document.open();document.write(page);document.close();
}catch(error){console.error(error);document.getElementById("load").innerHTML='<div class="mark">DLS</div><h1>Preview could not open</h1><p>Please refresh the page or <a href="/bathroom-builder">open the original working builder</a>.</p>';}})();
</script>
</body>
</html>
