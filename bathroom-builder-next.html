<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080a0b">
<title>Loading DLS Bathroom Builder — Stage Two</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:320px;background:#080a0b;color:#f7f4ed;font-family:Arial,Helvetica,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 25%,rgba(217,182,107,.14),transparent 27%),linear-gradient(145deg,#0d1112,#050606)}.card{width:min(520px,100%);padding:32px;border:1px solid rgba(217,182,107,.3);border-radius:20px;background:#14191a;box-shadow:0 26px 80px rgba(0,0,0,.45);text-align:center}.mark{display:grid;place-items:center;width:54px;height:54px;margin:auto;border:1px solid #d9b66b;border-radius:50%;color:#f1d794;font-size:13px;letter-spacing:.08em}.eyebrow{margin:18px 0 0;color:#d9b66b;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:9px 0 0;font-size:30px;line-height:1.05;letter-spacing:-.035em}p{margin:13px 0 0;color:#aaa79f;font-size:12px;line-height:1.7}.bar{height:6px;margin-top:23px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b88d44,#f1d794);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}button{display:none;margin:18px auto 0;min-height:43px;padding:0 17px;border:1px solid #d9b66b;border-radius:10px;background:rgba(217,182,107,.1);color:#f1d794;font:800 11px Arial;cursor:pointer}.error button{display:block}.error .bar{display:none}
</style>
</head>
<body>
<main><section class="card" id="card"><div class="mark">DLS</div><p class="eyebrow">Stage two demonstration</p><h1 id="title">Opening the bathroom builder</h1><p id="message">Loading the interactive product planner, smart room checks and tile calculator.</p><div class="bar"><i></i></div><button id="retry" type="button">Try again</button><noscript><p>This demonstration needs JavaScript enabled.</p></noscript></section></main>
<script>
(async()=>{
  const files=[1,2,3,4,5].map(n=>`/assets/builder-stage2/part${n}.b64`);
  const parts=await Promise.all(files.map(async url=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`Could not load ${url}`);return response.text()}));
  const encoded=parts.join('').replace(/\s/g,'');
  if(encoded.length!==28424)throw new Error('Preview data did not load completely');
  if(!('DecompressionStream' in window))throw new Error('This browser needs updating to open the demonstration');
  const bytes=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const page=await new Response(stream).text();
  document.open();document.write(page);document.close();
})().catch(error=>{
  console.error(error);
  document.querySelector('#card').classList.add('error');
  document.querySelector('#title').textContent='The preview did not open';
  document.querySelector('#message').textContent=error.message+'. Please refresh the page or open it in Chrome.';
});
document.querySelector('#retry').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
