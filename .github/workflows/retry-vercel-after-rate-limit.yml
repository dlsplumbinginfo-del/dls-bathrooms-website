name: Retry Vercel production after rate limit

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-vercel-production-retry
  cancel-in-progress: false

jobs:
  retry-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether the Vercel build window has reset
        id: gate
        shell: bash
        run: |
          not_before="$(date -u -d '2026-08-28T21:30:00Z' +%s)"
          now="$(date -u +%s)"
          if [ "$now" -lt "$not_before" ]; then
            echo "The 24-hour Vercel build window has not reset yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the production deployment and remove this one-time workflow
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          printf '\nVercel production retry: %s\n' "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> deploy-trigger.txt
          rm .github/workflows/retry-vercel-after-rate-limit.yml
          git config user.name "DLS Website Deployment"
          git config user.email "info@dlsbathrooms.co.uk"
          git add deploy-trigger.txt .github/workflows/retry-vercel-after-rate-limit.yml
          git commit -m "Retry full DLS website production deployment"
          git push origin main
