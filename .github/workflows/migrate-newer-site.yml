name: Migrate newer DLS website

on:
  push:
    branches:
      - migration/newer-site-2026-08-27
    paths:
      - tools/migrate_newer_site.py
      - .github/workflows/migrate-newer-site.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-newer-dls-site
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/newer-site-2026-08-27
          fetch-depth: 0

      - name: Validate migration script
        run: python -m py_compile tools/migrate_newer_site.py

      - name: Mirror the newer site and all 75 gallery photographs
        run: |
          rm -rf .migration-output
          mkdir -p .migration-output
          cp video-estimate.html .migration-output/video-estimate.html
          DLS_OUTPUT=.migration-output python tools/migrate_newer_site.py
          rsync -a .migration-output/ ./
          rm -rf .migration-output

      - name: Check required pages and legacy details
        run: |
          test -f index.html
          test -f quote.html
          test -f video-estimate.html
          test -f terms.html
          test -f privacy.html
          test -f areas/stockport.html
          test -f areas/manchester.html
          test -f areas/cheadle.html
          test "$(find projects -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 77
          ! grep -RniE '07304 056595|447304056595|dlsplumbinginfo@gmail.com|dlstilingandplumbing30@gmail.com|klarna' \
            index.html quote.html video-estimate.html terms.html privacy.html areas projects assets media \
            --include='*.html' --include='*.js' --include='*.css' --include='*.svg' --include='*.vtt' --include='*.json' || false

      - name: Commit the migrated site and media
        run: |
          git config user.name "DLS Website Migration"
          git config user.email "dlsplumbinginfo@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Migrate newer DLS site with 75-photo gallery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
