name: Apply regal preview styling
on:
  push:
    branches:
      - preview-white-theme-20260831
permissions:
  contents: write
jobs:
  apply-preview-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-white-theme-20260831
      - name: Inject preview stylesheet on HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          tag = '<link rel="stylesheet" href="/regal-preview.css" data-dls-preview="regal-white"/>'
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if 'data-dls-preview="regal-white"' in text:
                  continue
              if '</head>' in text:
                  text = text.replace('</head>', tag + '</head>', 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit preview-only HTML changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' || true
          git commit -m "Apply regal white styling across preview pages"
          git push origin HEAD:preview-white-theme-20260831
